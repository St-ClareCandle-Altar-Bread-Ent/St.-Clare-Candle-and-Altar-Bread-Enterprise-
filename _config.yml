# --- Site identity ---
title: St. Clare Candle and Altar Bread Enterprise
description: Handcrafted candles and consecration-ready altar bread from the Nuns of St. Clare in Ijebu-Ode, Ogun State, Nigeria.
name: St. Clare Candle and Altar Bread Enterprise
author: St. Clare Candle and Altar Bread Enterprise

# --- URLs ---
url: "https://st-clarecandle-altar-bread-ent.github.io"
baseurl: "/St.-Clare-Candle-and-Altar-Bread-Enterprise-"

# --- Language ---
lang: en
locale: en_NG

# --- SEO keywords ---
keywords:
  - St. Clare
  - candles
  - altar bread
  - communion wafers
  - Ijebu-Ode
  - Nigeria
  - monastery
  - Poor Clares
  - Catholic supplies

# --- Prevent Jekyll from processing static assets ---
include:
  - "_config.yml"

exclude:
  - README.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock

# --- Plugins (none needed for a static site) ---
plugins: []

# --- Markdown engine ---
markdown: kramdown
